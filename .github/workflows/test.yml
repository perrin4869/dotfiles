name: test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: lint
        uses: lunarmodules/luacheck@v1
      - name: style
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check home/.config

  test:
    runs-on: ubuntu-26.04
    env:
      # checkout gives sources a fresh mtime, so cmake recompiles ccls; sccache hashes content instead
      # no RUSTC_WRAPPER: atuin's workspace crates are uncacheable (sqlx::migrate! dirs, bin/proc-macro)
      # and it routes every cc-crate C compile through sccache, which made cold builds ~8m slower
      SCCACHE_GHA_ENABLED: "true"
      # rustc incremental reuses work by content hash, so cached target dirs help despite fresh mtimes;
      # build.incremental, since cargo disables incremental on CI otherwise, even if the profile enables it;
      # "true" not "1": sccache aborts every compile (ccls too) when CARGO_{BUILD_,}INCREMENTAL is "1"
      CARGO_BUILD_INCREMENTAL: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # full history + tags for the superproject and submodules, so builds that rely on
          # `git describe --tags` (e.g. deps/ccls, or a submodule's own build tooling) behave
          # the same as a real local clone instead of depending on shallow-clone shape
          fetch-depth: 0
      # rustup directly: dtolnay/rust-toolchain exports CARGO_INCREMENTAL=0, which overrides build.incremental
      - name: install rust toolchain
        id: rust
        run: |
          rustup update stable && rustup default stable
          echo "cachekey=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: install node.js # various dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: install lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: luajit
      - name: install luarocks # mason needs luarocks to intall luacheck
        uses: leafo/gh-actions-luarocks@v6
      - name: deps
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: stow libglib2.0-dev libmpv-dev dbus-x11 dconf-cli libavformat-dev libclang-22-dev
          # libglib2.0-dev libmpv-dev libavformat-dev - mpv-mpris
          # dbus-x11 dconf-cli - ibus
          # libclang-22-dev - ccls
          version: 1.0
      - name: install yq # needed for the mason registry to work locally (https://github.com/williamboman/mason.nvim/pull/1457)
        uses: mikefarah/yq@master
      - name: install neovim
        uses: rhysd/action-setup-vim@v1
        with:
          # apt neovim is too old
          neovim: true
          # `-` mapping conflict between oil vs nvim.dir is fixed as of
          # https://github.com/neovim/neovim/pull/40531
          version: nightly
        env:
          # /tmp is on a separate device on ubuntu-26.04, causing EXDEV on rename
          # https://github.com/rhysd/action-setup-vim/issues/80
          TMPDIR: ${{ runner.temp }}
      - name: install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('deps/atuin/Cargo.lock', 'home/.local/share/nvim/site/pack/default/opt/difftastic.nvim/Cargo.lock', 'home/.local/share/nvim/site/pack/default/opt/avante.nvim/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cache atuin
        uses: actions/cache@v6
        with:
          path: deps/atuin/target
          key: ${{ runner.os }}-atuin-incr-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('.git/modules/deps/atuin/HEAD') }}
          restore-keys: ${{ runner.os }}-atuin-incr-${{ steps.rust.outputs.cachekey }}-
      - name: cache difftastic
        uses: actions/cache@v6
        with:
          path: home/.local/share/nvim/site/pack/default/opt/difftastic.nvim/target
          key: ${{ runner.os }}-difftastic-incr-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('.git/modules/home/.local/share/nvim/site/pack/default/opt/difftastic.nvim/HEAD') }}
          restore-keys: ${{ runner.os }}-difftastic-incr-${{ steps.rust.outputs.cachekey }}-
      - name: cache avante
        uses: actions/cache@v6
        with:
          path: home/.local/share/nvim/site/pack/default/opt/avante.nvim/target
          key: ${{ runner.os }}-avante-incr-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('.git/modules/home/.local/share/nvim/site/pack/default/opt/avante.nvim/HEAD') }}
          restore-keys: ${{ runner.os }}-avante-incr-${{ steps.rust.outputs.cachekey }}-
      - name: build
        run: make
      - name: test build
        run:  make test-build
      - name: install
        run: |
          export $(dbus-launch) # dconf required dbus
          # stow conflicts
          rm ~/.bashrc ~/.bash_profile
          make install
      - name: test
        run: make test
      - name: bench
        run: make bench-nvim
