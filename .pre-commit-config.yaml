repos:
  - repo: local
    hooks:
      - id: luacheck
        name: luacheck
        entry: luacheck
        language: system
        types: [lua]
      - id: stylua
        name: stylua
        entry: stylua --check
        language: system
        types: [lua]
        files: ^home/\.config/
      - id: typescript
        name: typescript (tsc, oxlint, oxfmt)
        entry: npm run --silent check
        language: system
        files: ^(home/\.pi/agent/extensions/|package(-lock)?\.json$|\.ox(lint|fmt)rc\.json$)
        pass_filenames: false
