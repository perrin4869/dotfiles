# make prepare installs both; the checks below run on the commit, commitlint on its message
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: luacheck
        name: luacheck
        entry: luacheck
        language: system
        types: [lua]
      - id: stylua
        name: stylua
        entry: make test-stylua
        language: system
        pass_filenames: false
        always_run: true
      - id: neovim-cmds
        name: neovim command placeholders
        entry: make test-neovim-cmds
        language: system
        pass_filenames: false
        files: ^home/\.config/nvim/.*\.lua$
      - id: lua-types
        name: emmylua types
        entry: make test-lua-types
        language: system
        pass_filenames: false
        files: ^home/\.config/nvim/.*\.lua$
      - id: typescript
        name: typescript (tsc, oxlint, oxfmt, node --test)
        entry: sh -c 'npm run --silent check && npm test --silent'
        language: system
        files: ^(home/\.pi/agent/extensions/|PI\.md$|package(-lock)?\.json$|\.ox(lint|fmt)rc\.json$)
        pass_filenames: false
      - id: commitlint
        name: commitlint (conventional commits)
        entry: npx --no-install commitlint --edit
        language: system
        stages: [commit-msg]
