repos:
  - repo: local
    hooks:
      - id: luacheck
        name: luacheck
        entry: luacheck
        language: system
        types: [lua]
      - id: stylua
        name: stylua
        entry: make test-stylua
        language: system
        pass_filenames: false
        always_run: true
      - id: neovim-cmds
        name: neovim command placeholders
        entry: make test-neovim-cmds
        language: system
        pass_filenames: false
        files: ^home/\.config/nvim/.*\.lua$
      - id: typescript
        name: typescript (tsc, oxlint, oxfmt, node --test)
        entry: sh -c 'npm run --silent check && npm test --silent'
        language: system
        files: ^(home/\.pi/agent/extensions/|package(-lock)?\.json$|\.ox(lint|fmt)rc\.json$)
        pass_filenames: false
