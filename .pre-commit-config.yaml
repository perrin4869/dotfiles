repos:
  - repo: local
    hooks:
      - id: luacheck
        name: luacheck
        entry: luacheck
        language: system
        types: [lua]
      - id: stylua
        name: stylua
        # the check CI runs: .busted, .luacheckrc and rockspecs are Lua too, and the repository's own files sit below
        # hidden paths, so neither the extensions nor the defaults would find them
        entry: >-
          stylua --check -a . -g '*.lua' -g '*.rockspec' -g '.busted' -g '.luacheckrc'
          -g '!home/.local/**' -g '!home/.vim/**' -g '!deps/**' -g '!node_modules/**'
        language: system
        pass_filenames: false
        always_run: true
      - id: typescript
        name: typescript (tsc, oxlint, oxfmt, node --test)
        entry: sh -c 'npm run --silent check && npm test --silent'
        language: system
        files: ^(home/\.pi/agent/extensions/|package(-lock)?\.json$|\.ox(lint|fmt)rc\.json$)
        pass_filenames: false
