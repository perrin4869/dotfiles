repos:
  - repo: local
    hooks:
      - id: luacheck
        name: luacheck
        entry: luacheck
        language: system
        types: [lua]
      - id: stylua
        name: stylua
        entry: stylua --check
        language: system
        types: [lua]
        files: ^home/\.config/
      - id: pi-extensions
        name: pi extensions (tsc, oxlint, oxfmt)
        entry: npm --prefix home/.pi/agent/extensions run --silent check
        language: system
        files: ^home/\.pi/agent/extensions/
        pass_filenames: false
